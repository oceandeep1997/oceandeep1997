name: Generate contribution snake and stats card

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:      # allow manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out first: the snake step writes dist/ as root, which checkout cannot clean.
      - uses: actions/checkout@v4

      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Replaces github-readme-stats.vercel.app, which stopped serving (503 DEPLOYMENT_PAUSED).
      - name: Generate GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stats_card.py ${{ github.repository_owner }} dist/github-stats.svg
          python3 scripts/stats_card.py ${{ github.repository_owner }} dist/github-stats-dark.svg --dark

      - name: Publish artifacts to 'output' branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
